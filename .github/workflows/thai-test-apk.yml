name: Thai test APK

on:
  push:
    branches:
      - thai-localization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == '0xsacool/BYD-Assistant-TH'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Test, lint, and build release variant
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
      - name: Upload Thai test APK
        uses: actions/upload-artifact@v7
        with:
          name: BYD-Assistant-TH-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thai-build-diagnostics
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
